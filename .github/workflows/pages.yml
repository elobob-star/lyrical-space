name: Publish the web app

# The same app as a web page on GitHub Pages — only useful if the repository is PUBLIC (Pages is not free for private
# repos). For a private repo use Netlify / Cloudflare Pages instead (netlify.toml is ready; see docs/IOS.md).
# Run it by hand: Actions → "Publish the web app" → Run workflow. Needs Settings → Pages → Source: "GitHub Actions" once.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm test
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
